name: Release Desktop Apps

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  NODE_VERSION: 24

jobs:
  build-tauri:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
            bundles: deb,rpm
            rust_target: ""
            tauri_args: ""
          - name: Windows
            os: windows-latest
            bundles: nsis,msi
            rust_target: ""
            tauri_args: ""
          - name: macOS-Intel
            os: macos-15
            bundles: app
            rust_target: x86_64-apple-darwin
            tauri_args: --target x86_64-apple-darwin
          - name: macOS-Silicon
            os: macos-15
            bundles: app
            rust_target: aarch64-apple-darwin
            tauri_args: --target aarch64-apple-darwin

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl file libappindicator3-dev libfuse2 libssh2-1-dev libssl-dev librsvg2-dev libwebkit2gtk-4.1-dev patchelf

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add Rust target
        if: matrix.rust_target != ''
        run: rustup target add ${{ matrix.rust_target }}

      - name: Verify release tag matches project versions
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node --input-type=module - "$VERSION" <<'NODE'
          import fs from 'node:fs';
          import process from 'node:process';

          const expected = process.argv[2];
          const packageJson = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const packageLock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const tauri = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8'));
          const cargo = fs.readFileSync('src-tauri/Cargo.toml', 'utf8');
          const cargoLock = fs.readFileSync('src-tauri/Cargo.lock', 'utf8');

          const cargoVersion = cargo.match(/^version\s*=\s*"([^"]+)"/m)?.[1];
          const lockedCargoVersion = cargoLock.match(/\[\[package\]\]\nname = "db-sync-ssh"\nversion = "([^"]+)"/)?.[1];
          const versions = {
            'package.json': packageJson.version,
            'package-lock.json': packageLock.version,
            'package-lock.json root': packageLock.packages?.['']?.version,
            'tauri.conf.json': tauri.version,
            'Cargo.toml': cargoVersion,
            'Cargo.lock': lockedCargoVersion,
          };
          const mismatches = Object.entries(versions).filter(([, version]) => version !== expected);
          if (mismatches.length > 0) {
            console.error(`Release tag v${expected} does not match project versions:`);
            for (const [file, version] of mismatches) {
              console.error(`- ${file}: ${version ?? 'missing'}`);
            }
            process.exit(1);
          }
          NODE

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Generate release notes from commits
        id: release_notes
        shell: bash
        run: |
          CURRENT_TAG="${GITHUB_REF_NAME}"
          PREVIOUS_TAG=$(git tag --sort=-creatordate | grep -v "^${CURRENT_TAG}$" | head -n 1 || true)
          if [ -n "$PREVIOUS_TAG" ]; then
            COMMITS=$(git log "${PREVIOUS_TAG}..${CURRENT_TAG}" --pretty=format:"- %s (%h)")
          else
            COMMITS=$(git log --pretty=format:"- %s (%h)" -20)
          fi
          COMMITS=$(printf '%s\n' "$COMMITS" | grep -v -E "^- Release v[0-9]" || true)
          if [ -z "$COMMITS" ]; then
            COMMITS="- No new changes documented."
          fi
          {
            echo "body<<RELEASE_EOF"
            echo "### What's Changed"
            echo
            echo "$COMMITS"
            echo "RELEASE_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and publish Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: .
          tauriScript: npm run tauri
          args: --bundles ${{ matrix.bundles }} ${{ matrix.tauri_args }}
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseBody: ${{ steps.release_notes.outputs.body }}
          releaseDraft: false
          prerelease: false

      - name: Create and upload macOS DMG
        if: runner.os == 'macOS'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          TARGET="${{ matrix.rust_target }}"
          APP_DIR="src-tauri/target/${TARGET}/release/bundle/macos"
          APP_PATH="$(find "$APP_DIR" -maxdepth 1 -type d -name '*.app' -print -quit)"
          if [ -z "$APP_PATH" ]; then
            echo "Tauri app bundle not found in $APP_DIR" >&2
            exit 1
          fi

          ARCH_LABEL="x64"
          if [ "$TARGET" = "aarch64-apple-darwin" ]; then
            ARCH_LABEL="aarch64"
          fi

          DMG_NAME="DB-Sync-SSH_${VERSION}_${ARCH_LABEL}.dmg"
          STAGING_DIR="dmg_staging_${ARCH_LABEL}"
          mkdir -p "$STAGING_DIR"
          cp -R "$APP_PATH" "$STAGING_DIR/"
          ln -s /Applications "$STAGING_DIR/Applications"
          hdiutil create -volname "DB Sync Engine" -srcfolder "$STAGING_DIR" -ov -format UDZO "$DMG_NAME"
          rm -rf "$STAGING_DIR"
          gh release upload "$GITHUB_REF_NAME" "$DMG_NAME" --clobber

      - name: Create and upload Arch Linux package (.pkg.tar.zst)
        if: runner.os == 'Linux'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sudo apt-get install -y zstd
          VERSION="${GITHUB_REF_NAME#v}"
          node scripts/create-arch-pkg.mjs "$VERSION"
          gh release upload "$GITHUB_REF_NAME" DB.Sync.Engine-*.pkg.tar.zst --clobber

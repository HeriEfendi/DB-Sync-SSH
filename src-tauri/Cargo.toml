[package]
name = "db-sync-ssh"
version = "0.2.1"
description = "DB Sync Engine - MySQL/MariaDB over SSH"
authors = ["Heri Efendi <hheri58@gmail.com>"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["runtime-tokio-native-tls", "mysql", "json"] }
chrono = { version = "0.4", features = ["serde"] }
flate2 = "1.0"
futures-util = "0.3"
urlencoding = "2.1"
ssh2 = "0.9"
rfd = "0.15"
dirs = "6.0"

[lib]
name = "db_sync_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
